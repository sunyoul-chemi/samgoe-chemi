{% extends "layout.html" %}
{% block content %}

<style>
    .chatbot-wrapper {
        max-width: 900px;
        margin: 30px auto;
        padding: 30px;
        border-radius: 24px;
        background: rgba(255, 255, 255, 0.95);
        border: 2px solid #e2d9b8;
        box-shadow: 0 10px 30px rgba(0,0,0,0.06);
        backdrop-filter: blur(8px);
    }

    /* 채팅창 대화 영역 */
    .chat-container {
        width: 100%;
        height: 450px;
        background: #fffcf7;
        border: 1px solid #dcd6c5;
        border-radius: 16px;
        padding: 20px;
        overflow-y: auto;
        display: flex;
        flex-direction: column;
        gap: 15px;
        margin-bottom: 20px;
        box-shadow: inset 0 2px 8px rgba(0,0,0,0.02);
    }

    .chat-bubble {
        max-width: 75%;
        padding: 12px 18px;
        border-radius: 16px;
        font-size: 14px;
        line-height: 1.5;
        word-break: break-all;
    }

    .chat-bubble.bot {
        align-self: flex-start;
        background: #fff;
        border: 1px solid #e2d9b8;
        color: #333;
        border-bottom-left-radius: 4px;
        box-shadow: 0 2px 5px rgba(0,0,0,0.03);
    }

    .chat-bubble.user {
        align-self: flex-end;
        background: #bfa11d;
        color: #fff;
        border-bottom-right-radius: 4px;
        box-shadow: 0 2px 5px rgba(191,161,29,0.2);
    }

    /* 입력창 영역 */
    .chat-input-area {
        display: flex;
        gap: 10px;
    }

    .chat-input {
        flex: 1;
        padding: 14px 20px;
        border: 2px solid #bfa11d;
        border-radius: 14px;
        font-size: 15px;
        outline: none;
        background: #fff;
    }

    .chat-send-btn {
        background: #bfa11d;
        color: #fff;
        border: none;
        padding: 0 24px;
        border-radius: 14px;
        font-weight: 800;
        cursor: pointer;
        transition: 0.2s;
    }

    .chat-send-btn:hover {
        background: #a38914;
    }

    /* 추천 질문 태그 */
    .suggested-chips {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
        margin-bottom: 15px;
    }

    .suggest-chip {
        background: #fef9c3;
        border: 1px solid #fde047;
        color: #854d0e;
        padding: 6px 12px;
        border-radius: 20px;
        font-size: 12px;
        font-weight: 700;
        cursor: pointer;
        transition: 0.2s;
    }
    .suggest-chip:hover {
        background: #fde047;
    }
</style>

<div class="chatbot-wrapper">
    <div style="text-align: center; margin-bottom: 25px;">
        <span style="font-size: 42px;">🤖🧪</span>
        <h2 style="font-size: 26px; color: #1a1a1a; margin: 8px 0 6px 0; font-weight: 800;">CHEMI 실험 AI 챗봇</h2>
        <p style="color: #666; font-size: 14px; font-weight: 600;">172개의 동아리 보유 시약 데이터베이스를 기반으로 화학 반응을 자유롭게 물어보세요!</p>
    </div>

    <div class="suggested-chips">
        <span style="font-size: 12px; font-weight: 800; color: #888; align-self: center;">추천 질문:</span>
        <div class="suggest-chip" onclick="sendPreset('마그네슘조각이랑 묽은염산 섞으면 어떻게 돼?')">마그네슘 + 묽은염산</div>
        <div class="suggest-chip" onclick="sendPreset('묽은염산이랑 수산화나트륨 반응 알려줘')">묽은염산 + 수산화나트륨</div>
        <div class="suggest-chip" onclick="sendPreset('5%질산은수용액이랑 염화나트륨 섞으면?')">질산은 + 염화나트륨</div>
        <div class="suggest-chip" onclick="sendPreset('루미놀이랑 과산화수소 반응은?')">루미놀 + 과산화수소</div>
    </div>

    <div id="chatContainer" class="chat-container">
        <div class="chat-bubble bot">
            안녕하세요! 삼괴고 CHEMI 동아리 실험 AI 챗봇입니다. 🧪<br>
            궁금한 시약 조합이나 반응을 편하게 질문해 주세요! (예: "철분이랑 황산 섞으면?")
        </div>
    </div>

    <div class="chat-input-area">
        <input type="text" id="userInput" class="chat-input" placeholder="궁금한 화학 반응이나 시약을 질문해보세요..." onkeypress="handleKeyPress(event)">
        <button onclick="sendMessage()" class="chat-send-btn">전송 🚀</button>
    </div>
</div>

<script>
    // 💡 172가지 전체 시약 데이터베이스 (챗봇이 인식하고 검증하는 용도)
    const allReagents = [
        "5%질산은수용액", "99.5% 요오드화칼륨", "그람아이오딘", "대리석", "무수탄산나트륨", "무수황산마그네슘", "베네딕트용액", "벤토나이트", "붕사", "아이오딘-아이오딘화칼륨수용액", "아이오딘용액", "아이오딘화칼륨", "알루미늄분말", "알루미늄칼륨황산염", "알루미늄판", "염화구리", "염화나트륨", "염화나트륨용액", "염화제이철용액", "염화칼슘", "요오드산칼륨", "요오드산칼륨용액", "유황분말", "이산화망간", "젖산칼슘", "주석", "질산구리", "질산은용액", "질산칼륨", "철분", "철조각", "탄산동", "탄산칼슘", "함석", "활성탄", "황산구리", "황산구리5수화물", "황산구리용액", "황산구리용액1%", "황산망간1수화물", "황산수소나트륨", "황산아연7수화물", "황화나트륨",
        "1%메틸렌블루용액", "1%페놀프탈레인용액", "4-아미노페놀", "BTB용액", "BTB용액 청색", "DPPH용액(0.2mM)", "EDTA이나트륨2수화물", "글리세린", "닌히드린수용액", "루미놀", "말론산", "메틸렌블루", "메틸오렌지", "부틸렌글리콜", "살리실산", "살리실산99%", "샤프라닌O", "수단3용액", "식물성글리세린", "식용색소 노란", "식용색소 보라", "식용색소 빨강", "식용색소 파랑", "아세트올세인", "아세틸콜린", "요소", "인디고카민용액", "크리스탈바이올렛", "탈색제용액", "페놀레드용액", "페놀프탈레인0.1%", "페놀프탈레인용액 ×5", "프래그런스오일",
        "EM활성액", "LES", "가용성녹말", "가용성전분", "건조이스트", "고초균(Bacillus subtilis)", "김자액", "녹말", "녹말용액1%", "당밀", "대두레시틴", "대장균(E. coli) 플라스미드", "생효모", "아가(한천)", "알긴산나트륨", "알부민용액", "암피실린용액", "염산퀴닌용액", "올리브리퀴드", "완충용액 pH6", "완충용액 pH7", "우리밀누룩", "쪽(청대)", "카나마이신모노설페이트용액", "카탈라아제", "클로브버드오일", "클로브오일", "탈섬유소양혈", "포도당", "포도당98%", "포도당용액1%", "표준완충용액 pH 8.00", "핵산분리용완충용액(0.5X TAE)", "헤모글로빈용액",
        "무수제이인산나트륨", "탄산수소나트륨(l)", "탄산수소나트륨(s)",
        "10%인산", "5%아세트산수용액", "과산화수소 34.5%", "규산나트륨용액", "마그네슘조각", "묽은암모니아수", "묽은염산", "빙초산99.5%", "산화칼슘파우더", "설파믹산99%", "수산화나트륨(s)", "수산화바륨8수화물", "수산화칼륨95%", "아세톤", "아세트산무수물", "암모니아수용액", "에틸알코올95%", "인산85%", "중크롬산칼륨", "질산납용액", "질산암모늄98.5%", "크롬산칼륨",
        "35% 염산", "99.5% 벤젠", "99.5% 클로로포름", "99% 페놀", "Carbon tetrachloride", "Dichloromethane", "n-헥세인", "개미산99%", "나트륨조각", "마그네슘분말", "무수초산97%", "무수초산99%", "브롬수", "색소추출용용매제", "수산화나트륨", "아연분말", "에틸에테르99%", "염화메칠렌99.5%", "염화코발트", "인산", "자일렌(Xylene)", "전개액", "질산납", "질산니켈6수화물 98%", "질산용액60%", "초산에틸99.5%", "톨루엔(Toluene)", "황산95%", "황산용액95%"
    ];

    function handleKeyPress(e) {
        if (e.key === 'Enter') {
            sendMessage();
        }
    }

    function sendPreset(text) {
        document.getElementById('userInput').value = text;
        sendMessage();
    }

    function sendMessage() {
        const inputField = document.getElementById('userInput');
        const text = inputField.value.trim();
        if (!text) return;

        const chatContainer = document.getElementById('chatContainer');

        // 사용자 메시지 추가
        const userBubble = document.createElement('div');
        userBubble.className = 'chat-bubble user';
        userBubble.innerText = text;
        chatContainer.appendChild(userBubble);

        inputField.value = '';
        chatContainer.scrollTop = chatContainer.scrollHeight;

        // 봇 응답 생성 (약간의 딜레이로 실감 나게)
        setTimeout(() => {
            const botBubble = document.createElement('div');
            botBubble.className = 'chat-bubble bot';
            botBubble.innerHTML = generateBotResponse(text);
            chatContainer.appendChild(botBubble);
            chatContainer.scrollTop = chatContainer.scrollHeight;
        }, 500);
    }

    // 💡 스마트 화학 반응 분석 엔진 (챗봇 답변 생성)
    function generateBotResponse(query) {
        const q = query.toLowerCase();

        // 1. 산 + 염기 중화반응
        if ((q.includes("염산") || q.includes("황산") || q.includes("인산") || q.includes("아세트산")) && 
            (q.includes("수산화나트륨") || q.includes("수산화칼륨") || q.includes("암모니아"))) {
            return "🔥 <strong>중화 반응 분석 결과</strong><br>" +
                   "산과 염기가 만나면 수소 이온($H^+$)과 수산화 이온($OH^-$)이 결합하여 물($H_2O$)을 생성합니다.<br>" +
                   "• <strong>발열 여부:</strong> 열이 발생하는 발열 반응입니다.<br>" +
                   "• <strong>결과:</strong> 용액이 중성(또는 혼합 비율에 따른 액성)으로 변하며 염이 생성됩니다.";
        }
        // 2. 금속 + 산 (수소 기체)
        else if ((q.includes("마그네슘") || q.includes("아연") || q.includes("철분") || q.includes("철조각") || q.includes("알루미늄")) && 
                 (q.includes("염산") || q.includes("황산") || q.includes("아세트산"))) {
            return "⚡ <strong>금속과 산의 반응 분석 결과</strong><br>" +
                   "반응성(이온화 경향)이 큰 금속이 산과 반응합니다.<br>" +
                   "• <strong>발생 기체:</strong> 뽀글뽀글 **수소 기체($H_2$)**가 발생합니다. (점화 시 불꽃을 가까이 대면 '퐝' 소리가 나요!)<br>" +
                   "• <strong>결과:</strong> 금속이 녹아 들어가며 용액의 온도가 올라갑니다.";
        }
        // 3. 질산은 + 염화나트륨 (앙금 생성)
        else if (q.includes("질산은") && (q.includes("염화나트륨") || q.includes("염화"))) {
            return "✨ <strong>앙금 생성 반응 분석 결과</strong><br>" +
                   "은 이온($Ag^+$)과 염화물 이온($Cl^-$)이 만나 화학적으로 결합합니다.<br>" +
                   "• <strong>생성 물질:</strong> **염화 은($AgCl$) 흰색 앙금**이 즉시 생성됩니다.<br>" +
                   "• <strong>결과:</strong> 맑았던 용액이 하얗게 흐려지며 가라앉습니다.";
        }
        // 4. 루미놀 + 과산화수소 (발광)
        else if (q.includes("루미놀") && q.includes("과산화수소")) {
            return "🌟 <strong>화학 발광 반응 (루미놀 실험) 분석 결과</strong><br>" +
                   "• <strong>현상:</strong> 루미놀이 산화되면서 빛을 방출하는 **아름다운 푸른빛 화학 발광**이 일어납니다.<br>" +
                   "• <strong>특징:</strong> 어두운 실험실에서 진행할 때 가장 극적인 효과를 볼 수 있는 대표적인 동아리 실험입니다!";
        }
        // 5. BTB 지시약 관련 질문
        else if (q.includes("btb용액") || q.includes("btb")) {
            if (q.includes("산") || q.includes("염산") || q.includes("황산")) {
                return "🟡 <strong>BTB 지시약 (산성 조건):</strong> BTB 용액은 산성 용액에서 **노란색**으로 변색됩니다.";
            } else if (q.includes("염기") || q.includes("수산화나트륨") || q.includes("암모니아")) {
                return "🔵 <strong>BTB 지시약 (염기성 조건):</strong> BTB 용액은 염기성 용액에서 **파란색**으로 변색됩니다.";
            } else {
                return "🟢 BTB 용액은 대표적인 산-염기 지시약으로, 중성에서는 초록색, 산성에서는 노란색, 염기성에서는 파란색을 띱니다.";
            }
        }
        // 일반적인 시약 단일 조회 또는 매칭 안 될 때
        else {
            // 입력된 텍스트에 172개 시약 중 포함된 게 있는지 체크
            let foundMatch = allReagents.find(r => q.includes(r.toLowerCase()));
            if (foundMatch) {
                return `📦 <strong>시약 데이터베이스 검색 완료</strong><br>` +
                       `입력하신 <strong>[${foundMatch}]</strong>은(는) 삼괴고 CHEMI 동아리 보유 시약입니다!<br>` +
                       `이 시약과 함께 섞을 다른 시약(예: 산, 염기, 금속 등)을 함께 적어 질문해 주시면 구체적인 반응 메커니즘을 알려드릴게요.`;
            } else {
                return `🤖 질문 내용을 분석했으나, 정확한 화학 반응 매칭을 찾지 못했어요.<br>` +
                       `"마그네슘이랑 묽은염산", "질산은이랑 염화나트륨"처럼 <strong>두 가지 이상의 시약 이름을 함께</strong> 물어보시면 AI가 완벽하게 분석해 드립니다!`;
            }
        }
    }
</script>

{% endblock %}
